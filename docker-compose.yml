services:
  printfix-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: printfix-frontend
    restart: unless-stopped
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.printfix-frontend.entrypoints=websecure"
      - "traefik.http.routers.printfix-frontend.rule=Host(`printfix.in`) || Host(`www.printfix.in`)"
      - "traefik.http.routers.printfix-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.printfix-frontend.loadbalancer.server.port=80"

networks:
  traefik-public:
    external: true
